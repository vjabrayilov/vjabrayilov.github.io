- title: "An Expert in Residence: LLM Agents for Always-On Operating System Tuning"
  selected: true
  summary: "Uses LLM agents to tune operating systems continuously."
  authors: ["Georgios Liargkovas", "Vahab Jabrayilov", "Hubertus Franke", "Kostis Kaffes"]
  venue: "NeurIPS MLForSys Workshop"
  year: 2025
  pdf: "assets/pdf/papers/expert-in-residence-mlforsys25.pdf"
  source_url: "https://neurips.cc/virtual/2025/129122"
  source_label: "NeurIPS"
  abstract: "Classical machine-learning auto-tuners for OS control struggle with semantic gaps, brittle rewards, and unsafe exploration. We introduce an online, LLM-driven agent that emulates expert reasoning for continuous OS optimization. When tuning the Linux Completely Fair Scheduler’s hyperparameters, the agent outperforms Bayesian optimization by 5% in single-parameter tuning, 7.1% in two-parameter co-tuning, and a human expert by 2.98% overall, while converging faster and adapting more quickly to workload changes. When application counters are unavailable, system-level proxies (e.g., Instructions Per Cycle (IPC)) preserved tail latency in our setup. Putting this together, we propose adopting the Model Context Protocol (MCP) for tool/resource discovery and invocation and a logging channel; on top of that, we propose adding transactional apply–commit–revert, host-mediated approval gates, and policy controls in the OS-tuning server and host to ensure safe, auditable operation. Our results and reference design suggest a practical path toward safe, self-adapting OS control."
  bibtex: |
    @inproceedings{liargkovas2025expert,
      author = {Liargkovas, Georgios and Jabrayilov, Vahab and Franke, Hubertus and Kaffes, Kostis},
      title = {An Expert in Residence: LLM Agents for Always-On Operating System Tuning},
      booktitle = {NeurIPS 2025 Workshop on Machine Learning for Systems},
      year = {2025}
    }

- title: "HoliPaxos: Towards More Predictable Performance in State Machine Replication"
  selected: true
  summary: "Makes state machine replication performance more predictable."
  authors: ["Zhiying Liang", "Vahab Jabrayilov", "Abutalib Aghayev", "Aleksey Charapko"]
  venue: "VLDB"
  year: 2025
  pdf: "assets/pdf/papers/holipaxos-vldb25.pdf"
  source_url: "https://doi.org/10.14778/3742728.3742744"
  source_label: "VLDB"
  abstract: "State machine replication (SMR) algorithms ensure redundancy in critical systems and, as a result, underpin fault-tolerant distributed databases. Good SMR protocol performance is essential for capacity planning and meeting desired performance objectives. However, many implementations of popular SMR algorithms, such as MultiPaxos and Raft, have issues that make their performance unpredictable. This unpredictability often arises from certain “bolt-on” additions to core protocols, such as external failure detectors and replication log compaction. In this paper, we argue that tighter integration of such traditionally ad-hoc mechanisms with the core replication protocols can stabilize performance, making the solutions more reliable and more accessible to accurate capacity planning. Moreover, we show that these integrations can be nondisruptive for the underlying consensus algorithm, resulting in systems that preserve the simplicity and safety of traditional single-leader consensus-based SMR. To that order, we integrate the failure and slowdown detectors inside the SMR and achieve better performance and faster fail-over under various network partitions and node slowdown events. We also illustrate that tight integration of replication log management, pruning, and snapshotting can reduce memory and CPU usage while avoiding performance fluctuations associated with traditional log compaction and cleanup approaches."
  bibtex: |
    @article{DBLP:journals/pvldb/LiangJAC25,
      author = {Liang, Zhiying and Jabrayilov, Vahab and Aghayev, Abutalib and Charapko, Aleksey},
      title = {HoliPaxos: Towards More Predictable Performance in State Machine Replication},
      journal = {Proc. {VLDB} Endow.},
      volume = {18},
      number = {8},
      pages = {2505--2518},
      year = {2025}
    }

- title: "Practical Considerations for Implementing State Machine Replication in the Cloud"
  authors: ["Zhiying Liang", "Vahab Jabrayilov", "Abutalib Aghayev", "Aleksey Charapko"]
  venue: "ICDCS"
  year: 2025
  pdf: "assets/pdf/papers/practical-considerations-smr-icdcs25.pdf"
  source_url: "https://par.nsf.gov/servlets/purl/10663014"
  source_label: "NSF PAR"
  abstract: "State Machine Replication (SMR) protocols form the backbone of many distributed systems. Enterprises and startups increasingly build their distributed systems on the cloud due to its many advantages, such as scalability and cost-effectiveness. Due to their prevalence in systems, the practical aspects of SMR algorithms, such as efficiency and performance, become hugely important. These practical considerations can impact capacity planning, deployment strategies, and, ultimately, the cost of running stateful systems in the cloud. In this paper, we consider various practical choices that impact the performance and efficiency of state machine replication in the cloud. To that order, we design a language-agnostic Multi-Paxos-based state machine architecture and implement it in several languages popular for cloud deployment. In the process, we investigate the impact of threading, communication, and memory management models on replicated state machines’ performance and resource efficiency. We also examine the high-level implications of virtualization on the performance of SMR implementations in various languages. We present our findings as a collection of practical lessons backed by our experimental data and analysis."
  bibtex: |
    @inproceedings{liang2025practical,
      author = {Liang, Zhiying and Jabrayilov, Vahab and Aghayev, Abutalib and Charapko, Aleksey},
      title = {Practical Considerations for Implementing State Machine Replication in the Cloud},
      booktitle = {IEEE 45th International Conference on Distributed Computing Systems (ICDCS)},
      pages = {791--801},
      year = {2025}
    }

- title: "Rethinking the Networking Stack for Serverless Environments: A Sidecar Approach"
  authors: ["Vishwanath Seshagiri", "Abhinav Gupta", "Vahab Jabrayilov", "Avani Wildani", "Kostis Kaffes"]
  venue: "ACM SoCC"
  year: 2024
  pdf: "assets/pdf/papers/rethinking-networking-serverless-socc24.pdf"
  source_url: "https://doi.org/10.1145/3698038.3698561"
  source_label: "ACM"
  abstract: "Serverless platforms rely on legacy networking stacks for communication and data movement. We quantitatively analyze the performance of these stacks and show their mismatch with highly consolidated, virtualized modern serverless environments, focusing on Firecracker, the most common serverless virtualization framework. As serverless applications grow in complexity and interaction, the resulting network bottleneck is a prime source of user-perceived, end-to-end latency. In this paper, we present a detailed vision of a new, sidecar-based networking stack for serverless environments. Our primary design goal is to provide low-overhead networking while maintaining existing security guarantees. We outline the research challenges in both the control and the data plane that the community needs to tackle before such a sidecar architecture can be used in practice."
  bibtex: |
    @article{10.1145/3698038.3698561,
      author = {Seshagiri, Vishwanath and Gupta, Abhinav and Jabrayilov, Vahab and Wildani, Avani and Kaffes, Kostis},
      title = {Rethinking the Networking Stack for Serverless Environments: A Sidecar Approach},
      year = {2024},
      isbn = {9798400712869},
      publisher = {Association for Computing Machinery},
      booktitle = {Proceedings of the 2024 ACM Symposium on Cloud Computing},
      pages = {213–222},
      series = {SoCC '24}
    }

- title: "MultiPaxos Made Complete"
  authors: ["Zhiying Liang", "Vahab Jabrayilov", "Aleksey Charapko", "Abutalib Aghayev"]
  venue: "arXiv"
  year: 2024
  pdf: "assets/pdf/papers/multipaxos-made-complete.pdf"
  source_url: "https://arxiv.org/abs/2405.11183"
  source_label: "arXiv"
  abstract: "MultiPaxos, while a fundamental Replicated State Machine algorithm, suffers from a dearth of comprehensive guidelines for achieving a complete and correct implementation. This deficiency has hindered MultiPaxos' practical utility and adoption and has resulted in flawed claims about its capabilities. Our paper aims to bridge the gap between MultiPaxos' complexity and practical implementation through a meticulous and detailed design process spanning more than a year. It carefully dissects each phase of MultiPaxos and offers detailed step-by-step pseudocode -- in addition to a complete open-source implementation -- for all components, including the leader election, the failure detector, and the commit phase. The implementation of our complete design also provides better performance stability, resource usage, and network partition tolerance than naive MultiPaxos versions. Our specification includes a lightweight log compaction approach that avoids taking repeated snapshots, significantly improving resource usage and performance stability. Our failure detector, integrated into the commit phase of the algorithm, uses variable and adaptive heartbeat intervals to settle on a better leader under partial connectivity and network partitions, improving liveness under such conditions."
  bibtex: |
    @article{liang2024multipaxoscomplete,
      title = {MultiPaxos Made Complete},
      author = {Liang, Zhiying and Jabrayilov, Vahab and Charapko, Aleksey and Aghayev, Abutalib},
      year = {2024},
      eprint = {2405.11183},
      archivePrefix = {arXiv},
      primaryClass = {cs.DC}
    }

- title: "The Cost of Garbage Collection for State Machine Replication"
  authors: ["Zhiying Liang", "Vahab Jabrayilov", "Aleksey Charapko", "Abutalib Aghayev"]
  venue: "arXiv"
  year: 2024
  pdf: "assets/pdf/papers/cost-of-gc-smr.pdf"
  source_url: "https://arxiv.org/abs/2405.11182"
  source_label: "arXiv"
  abstract: "State Machine Replication (SMR) protocols form the backbone of many distributed systems. Enterprises and startups increasingly build their distributed systems on the cloud due to its many advantages, such as scalability and cost-effectiveness. One of the first technical questions companies face when building a system on the cloud is which programming language to use. Among many factors that go into this decision is whether to use a language with garbage collection (GC), such as Java or Go, or a language with manual memory management, such as C++ or Rust. Today, companies predominantly prefer languages with GC, like Go, Kotlin, or even Python, due to ease of development; however, there is no free lunch: GC costs resources (memory and CPU) and performance (long tail latencies due to GC pauses). While there have been anecdotal reports of reduced cloud cost and improved tail latencies when switching from a language with GC to a language with manual memory management, so far, there has not been a systematic study of the GC overhead of running an SMR-based cloud system. This paper studies the overhead of running an SMR-based cloud system written in a language with GC. To this end, we design from scratch a canonical SMR system -- a MultiPaxos-based replicated in-memory key-value store -- and we implement it in C++, Java, Rust, and Go. We compare the performance and resource usage of these implementations when running on the cloud under different workloads and resource constraints and report our results. Our findings have implications for the design of cloud systems."
  bibtex: |
    @article{liang2024costgarbagecollectionstate,
      title = {The Cost of Garbage Collection for State Machine Replication},
      author = {Liang, Zhiying and Jabrayilov, Vahab and Charapko, Aleksey and Aghayev, Abutalib},
      year = {2024},
      eprint = {2405.11182},
      archivePrefix = {arXiv},
      primaryClass = {cs.DC}
    }

