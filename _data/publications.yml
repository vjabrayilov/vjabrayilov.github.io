- title: "Enabling Fast Networking in the Public Cloud"
  selected: true
  anchor: "pub-machnet"
  summary: "Presents Machnet, a C++ DPDK messaging library for public cloud VMs."
  authors: ["Alireza Sanaee", "Vahab Jabrayilov", "Ilias Marinos", "Farbod Shahinfar", "Divyanshu Saxena", "Gianni Antichi", "Kostis Kaffes"]
  equal: ["Alireza Sanaee", "Vahab Jabrayilov"]
  venue: "ASPLOS"
  year: 2026
  pdf: "assets/pdf/papers/enabling-fast-networking-asplos26.pdf"
  source_url: "https://doi.org/10.1145/3779212.3790158"
  source_label: "ACM"
  talks:
    - label: "P99 CONF Talk"
      url: "https://p99conf.io/session/how-we-hit-bare-metal-tail-latency-inside-cloud-vms-machnet/"
    - label: "NYC Systems Talk"
      url: "https://www.youtube.com/watch?v=ksRUv_axLU4"
  abstract: "Despite a decade of research, most high-performance userspace network stacks remain impractical for public cloud tenants developing their applications atop Virtual Machines (VMs). We identify two root causes: (1) reliance on specialized NIC features (e.g., flow steering, deep buffers) absent in commodity cloud vNICs, and (2) rigid execution models ill-suited to diverse application needs. We present Machnet, a high-performance and flexible userspace network stack designed for public cloud VMs. Machnet uses only a minimal set of vNIC features that any major cloud provider supports. It also relies on a microkernel architecture to enable flexible application execution. We evaluate Machnet across three major public clouds and on production-grade applications, including a key-value store, an HTTP server, and a state-machine replication system. We release Machnet at https://github.com/microsoft/machnet."
  bibtex: |
    @inproceedings{10.1145/3779212.3790158,
      author = {Sanaee, Alireza and Jabrayilov, Vahab and Marinos, Ilias and Shahinfar, Farbod and Saxena, Divyanshu and Antichi, Gianni and Kaffes, Kostis},
      title = {Enabling Fast Networking in the Public Cloud},
      booktitle = {Proceedings of the 31st ACM International Conference on Architectural Support for Programming Languages and Operating Systems, Volume 2},
      pages = {679--696},
      year = {2026},
      doi = {10.1145/3779212.3790158}
    }

